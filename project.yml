name: Outbox
options:
  bundleIdPrefix: engineering.xo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.6"
    macOS: "26.6"
packages:
  OutboxKit:
    path: OutboxKit
targets:
  Outbox:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: OutboxKit
    # DEVELOPMENT_TEAM lives here, untracked, so the repo carries nobody's team ID.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Outbox.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: engineering.xo.Outbox
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Outbox
        CFBundleURLTypes:
          - CFBundleURLName: engineering.xo.Outbox
            CFBundleURLSchemes: [outbox]
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
    entitlements:
      path: App/Outbox.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
